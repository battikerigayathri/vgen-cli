initialStage: collect_line_items
stages:
  - id: collect_line_items
    label: Collect line items
    kind: collect
    hitlSlug: reset-invalid-lines-form
    doneWhen: [lineItems]
    next: review_summary

  - id: review_summary
    label: Review summary
    kind: review
    hitlSlug: reset-invalid-review-form
    doneWhen: [reviewConfirmed]
    transitions:
      - target: submit
        when:
          eq:
            field: inputs.reviewConfirmed
            value: true
      - target: collect_line_items
        when:
          eq:
            field: inputs.reviewConfirmed
            value: false
        reset:
          - notARealField
    next: submit

  - id: submit
    label: Submitted
    kind: terminal
    terminal: true
    doneWhen: terminal
