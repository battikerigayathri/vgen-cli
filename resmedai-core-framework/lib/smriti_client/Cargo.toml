[package]
name = "smriti_client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "push_workflow_definition"
path = "src/bin/push_workflow_definition.rs"

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.29"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
workflow_schema = { path = "../workflow_schema" }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
