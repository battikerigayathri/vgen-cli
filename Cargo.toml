[package]
name = "vgen"
version = "1.1.0"
edition = "2021"
default-run = "vgen"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
jsonwebtoken = "9"
reqwest = { version = "0.11", features = ["json"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
rustyline = "18.0.0"
tokio-tungstenite = { version = "0.29", features = ["connect"] }
chrono = "0.4"
futures-util = "0.3"
smriti_client = { path = "resmedai-core-framework/lib/smriti_client" }
workflow_types = { path = "resmedai-core-framework/lib/workflow_types" }

[[bin]]
name = "vgen"
path = "src/main.rs"

[[bin]]
name = "vgen-mcp"
path = "src/bin/vgen_mcp.rs"
